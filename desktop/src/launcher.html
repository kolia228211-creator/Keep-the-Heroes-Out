<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Ходу героям нема!</title>
<style>
:root{color-scheme:dark;--bg:#120e0c;--fg:#f3e9d9;--mu:#b5a48c;--ac:#f2a93b;--bad:#e8573f;--line:#4d3b2c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% -10%,#4a2f17 0%,var(--bg) 62%);color:var(--fg);font:16px/1.4 'Segoe UI',system-ui,sans-serif;user-select:none}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.fig{width:120px;height:144px;filter:drop-shadow(0 8px 8px #000a);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{margin:0;font:400 clamp(36px,6vw,64px)/.95 'Arial Black',system-ui,sans-serif;color:#fff;text-shadow:0 4px 0 #000,0 0 30px #f2a93b55;-webkit-text-stroke:1px #000}
#status{min-height:1.4em;color:var(--fg)}
.bar{width:min(420px,80vw);height:12px;border-radius:8px;background:#0008;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6b94e,#d98a1c);transition:width .2s}
.bar.indet i{width:35%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
#note{color:var(--mu);font-size:14px;min-height:1.4em}
#err{display:none;max-width:520px;color:var(--bad)}
button{font:inherit;font-weight:700;color:#24160a;background:linear-gradient(#f6b94e,#d98a1c);border:1px solid #8a5208;border-radius:8px;padding:10px 18px;cursor:pointer}
button[hidden]{display:none}
footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#7d6f5d;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <svg class="fig" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="20" cy="43" rx="15" ry="4.5" fill="#e0503c" stroke="#000" stroke-opacity=".5"/><path d="M8 40c0-12 4-20 10-24l-2-8 6 5c3-1 6-1 8 1l5-6-1 9c3 3 4 8 2 12l-6 2c2 4 2 8 0 9z" fill="#e04a3a" stroke="#4a0d08" stroke-width="1.4" stroke-linejoin="round"/><path d="M14 40c0-8 2-13 6-15 3 3 4 9 2 15z" fill="#ffc83d" stroke="#4a0d08" stroke-width="1"/><circle cx="29" cy="15" r="1.6" fill="#000"/><path d="M5 26l7-4-1 8z" fill="#c23a2c" stroke="#4a0d08"/></svg>
  <h1>Ходу героям нема!</h1>
  <div id="status">Запуск…</div>
  <div class="bar indet" id="bar"><i></i></div>
  <div id="note"></div>
  <div id="err"></div>
  <button id="retry" hidden>Спробувати ще раз</button>
</main>
<footer id="ver"></footer>
<script>
const $ = id => document.getElementById(id);
function show(s) {
  const bar = $('bar'), st = $('status');
  $('err').style.display = 'none'; $('retry').hidden = true; bar.style.visibility = 'visible';
  if (s.stage === 'checking') { st.textContent = 'Перевіряю оновлення гри…'; bar.className = 'bar indet'; }
  else if (s.stage === 'downloading') {
    st.textContent = `Завантажую оновлення ${s.version}… ${Math.round((s.progress || 0) * 100)}%`;
    bar.className = 'bar'; bar.firstElementChild.style.width = Math.round((s.progress || 0) * 100) + '%';
  }
  else if (s.stage === 'installing') { st.textContent = `Встановлюю версію ${s.version}…`; bar.className = 'bar indet'; }
  else if (s.stage === 'starting') { st.textContent = s.version ? `Запускаю гру (версія ${s.version})…` : 'Запуск…'; bar.className = 'bar'; bar.firstElementChild.style.width = '100%'; }
  else if (s.stage === 'error') {
    st.textContent = 'Гру не вдалося запустити'; bar.style.visibility = 'hidden';
    $('err').textContent = s.error || ''; $('err').style.display = 'block'; $('retry').hidden = false;
  }
  $('note').textContent = s.note || '';
}
if (window.hhn) {
  hhn.launcher.onStatus(show);
  hhn.launcher.state().then(show);
  hhn.info().then(i => { $('ver').textContent = 'Програма ' + i.shellVersion; });
  $('retry').onclick = () => hhn.launcher.retry();
}
</script>
</body>
</html>
