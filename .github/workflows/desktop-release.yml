# Збирає інсталятор Windows і публікує його в GitHub Releases.
# Публікація відбувається сама, коли в main з'являється нова версія в desktop/package.json
# (реліза vX.Y.Z ще немає). Інакше лише тести гри й оновлювача.
# Вручну: вкладка Actions → «Збірка програми для Windows» → Run workflow (готовий .exe — в артефактах).
name: Збірка програми для Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'game/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Чи є вже реліз цієї версії
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          API="repos/$GITHUB_REPOSITORY/releases"
          OK=$(gh api "$API?per_page=100" --jq "[.[] | select(.tag_name==\"v$V\" and .draft==false and any(.assets[]; .name==\"HoduHeroyamNema-Setup-$V.exe\") and any(.assets[]; .name==\"latest.yml\"))] | length")
          if [ "$OK" != "0" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Реліз v$V уже опубліковано повністю — нічого не роблю."
            exit 0
          fi
          # прибрати неповні релізи й чернетки цієї версії (могли лишитися від невдалих запусків)
          for id in $(gh api "$API?per_page=100" --jq ".[] | select(.tag_name==\"v$V\") | .id"); do
            echo "Видаляю неповний реліз $id"; gh api -X DELETE "$API/$id"
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$V" 2>/dev/null || true
          echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Публікую нову версію програми v$V."

      - name: Створити чернетку релізу
        if: steps.ver.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          cat > notes.md <<NOTES
          **Як встановити:** завантажте \`HoduHeroyamNema-Setup-$V.exe\` нижче й запустіть.
          Якщо Windows покаже «Windows захистила ваш ПК» — натисніть **«Докладніше» → «Виконати однаково»** (програма не має платного підпису).

          Вже встановлена програма оновиться сама. Нові версії гри завантажуються під час запуску, перевстановлювати нічого не треба.
          NOTES
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --title "Програма $V" --target "$GITHUB_SHA" --notes-file notes.md

      - name: Зібрати інсталятор і завантажити в чернетку
        if: steps.ver.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if ! npm run release 2>&1 | tee build.log; then
            # показати хвіст журналу в примітках запуску (їх видно навіть без доступу до логів)
            tail -n 40 build.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Перевірити й опублікувати реліз
        if: steps.ver.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          API="repos/$GITHUB_REPOSITORY/releases"
          IDS=$(gh api "$API?per_page=100" --jq ".[] | select(.tag_name==\"v$V\" and .draft) | .id")
          if [ "$(echo "$IDS" | wc -w)" != "1" ]; then echo "::error::Очікувалась одна чернетка v$V, знайдено: $IDS"; exit 1; fi
          ASSETS=$(gh api "$API/$IDS" --jq '[.assets[].name] | join(" ")')
          echo "Файли релізу: $ASSETS"
          for f in "HoduHeroyamNema-Setup-$V.exe" "latest.yml"; do
            case " $ASSETS " in *" $f "*) ;; *) echo "::error::У релізі немає $f"; exit 1;; esac
          done
          gh api -X PATCH "$API/$IDS" -F draft=false -f make_latest=true --jq '.html_url'

      - name: Зібрати інсталятор (без публікації, лише вручну)
        if: github.event_name == 'workflow_dispatch' && (steps.ver.outputs.publish != 'true' || github.ref != 'refs/heads/main')
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.ver.outputs.version }}
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: ignore
